<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ОТТИСК" />
  <meta name="theme-color" content="#120d14" />
  <meta name="description" content="ОТТИСК — удерживай палец: существо живёт только в касании." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>ОТТИСК</title>
</head>
<body>
  <div id="app" data-theme="0">
    <main id="stage" class="stage">
      <div class="aura" aria-hidden="true"></div>
      <canvas id="game" aria-label="Игровое поле ОТТИСК"></canvas>
      <div id="float-layer" class="float-layer">
        <div id="combo" class="combo"></div>
        <div id="toast" class="toast"></div>
        <div id="coach" class="coach"></div>
      </div>
    </main>

    <footer id="status" class="status hidden">
      <div class="status-left">
        <span class="meta-label">след</span>
        <span id="score">0</span>
      </div>
      <div class="status-center">
        <div class="heat-head">
          <span class="meta-label">жар</span>
          <span id="heat-pct" class="heat-pct">0%</span>
        </div>
        <div id="heat" class="heat" aria-label="Жар">
          <i id="heat-fill"></i>
        </div>
        <div class="mut-track" aria-hidden="true">
          <div id="mut-track-fill" class="mut-track-fill"></div>
        </div>
      </div>
      <div class="status-right">
        <span class="meta-label">форма</span>
        <span id="mut-badge" class="meta-value">искра</span>
        <span id="theme-chip" class="meta-value dim">тон 1</span>
        <span id="next-mut" class="meta-next"></span>
      </div>
    </footer>

    <div id="screen-start" class="screen">
      <div class="screen-bg" aria-hidden="true"></div>
      <div class="brand-block">
        <p class="eyebrow">удерживай · не кликай</p>
        <p class="brand">ОТТИСК</p>
        <h1 class="tagline">Живёт только под пальцем.</h1>
        <p class="hint">Води по свету. Отпустил — исчезло. Красные охотники идут на след. Каждые 100 света мир меняет цвет.</p>
      </div>
      <div class="actions">
        <button id="btn-start" class="btn btn-primary" type="button">
          <span class="btn-main">Удерживай</span>
          <span class="btn-sub">зажми и не отпускай</span>
        </button>
        <div class="hold-meter" aria-hidden="true"><i id="hold-fill"></i></div>
        <p class="best">Рекорд <span id="best-start">0</span></p>
      </div>
      <p class="install-tip">iPhone · Поделиться · На экран «Домой»</p>
    </div>

    <div id="screen-over" class="screen hidden">
      <div class="screen-bg dim" aria-hidden="true"></div>
      <div class="over-card">
        <p class="over-label">След оборвался</p>
        <p class="brand over-brand">ОТТИСК</p>
        <p id="final-score" class="final-score">0</p>
        <p class="over-sub">света</p>
        <p id="death-reason" class="death-reason"></p>
        <p id="mut-summary" class="mut-summary"></p>
        <p class="best">Рекорд <span id="best-over">0</span></p>
        <button id="btn-retry" class="btn btn-primary" type="button">
          <span class="btn-main">Ещё раз</span>
          <span class="btn-sub">удерживай кнопку</span>
        </button>
        <div class="hold-meter over"><i id="hold-fill-over"></i></div>
      </div>
    </div>
  </div>
  <script src="js/game.js" type="module"></script>
</body>
</html>
