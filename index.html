<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ВЫСОТА" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="ВЫСОТА — залипательная башня на один палец. Тапай в ритм и строй выше." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>ВЫСОТА</title>
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Игровое поле ВЫСОТА"></canvas>

    <div id="hud" class="hud hidden">
      <div class="hud-score">
        <span class="hud-label">этаж</span>
        <span id="score">0</span>
      </div>
      <div id="combo" class="combo"></div>
    </div>

    <div id="screen-start" class="screen">
      <div class="screen-bg" aria-hidden="true"></div>
      <div class="brand-block">
        <p class="brand">ВЫСОТА</p>
        <h1 class="tagline">Один палец. Бесконечная башня.</h1>
        <p class="hint">Тапни, когда блок совпадёт — и строй выше.</p>
      </div>
      <div class="actions">
        <button id="btn-start" class="btn btn-primary" type="button">Играть</button>
        <p class="best">Рекорд: <span id="best-start">0</span></p>
      </div>
      <p class="install-tip">На iPhone: Поделиться → На экран «Домой»</p>
    </div>

    <div id="screen-over" class="screen hidden">
      <div class="screen-bg dim" aria-hidden="true"></div>
      <div class="over-card">
        <p class="over-label">Падение с</p>
        <p class="brand over-brand">ВЫСОТА</p>
        <p id="final-score" class="final-score">0</p>
        <p class="over-sub">этажей</p>
        <p class="best">Рекорд: <span id="best-over">0</span></p>
        <button id="btn-retry" class="btn btn-primary" type="button">Ещё раз</button>
      </div>
    </div>
  </div>

  <script src="js/game.js" type="module"></script>
</body>
</html>
